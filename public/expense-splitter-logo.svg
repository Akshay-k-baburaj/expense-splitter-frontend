<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Expense Splitter logo</title>
  <desc id="desc">A forest-green rounded emblem with a cream geometric E and terracotta split accent, beside the Expense Splitter wordmark.</desc>

  <!-- Emblem -->
  <g transform="translate(70 70)">
    <rect x="0" y="0" width="260" height="260" rx="66" fill="#1E382C"/>
    <!-- Geometric E -->
    <path d="M76 76H184C194 76 202 84 202 94C202 104 194 112 184 112H112V130H169C179 130 187 138 187 148C187 158 179 166 169 166H112V184H184C194 184 202 192 202 202C202 212 194 220 184 220H76C66 220 58 212 58 202V94C58 84 66 76 76 76Z" fill="#F5EFDF"/>
    <!-- Split accent -->
    <path d="M151 130H207" stroke="#895440" stroke-width="15" stroke-linecap="round"/>
    <circle cx="207" cy="130" r="13" fill="#E6CBB8"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(385 0)">
    <text x="0" y="190" fill="#1E382C" font-family="'Instrument Sans', 'Avenir Next', Arial, sans-serif" font-size="91" font-weight="650" letter-spacing="-3">expense</text>
    <text x="0" y="282" fill="#1E382C" font-family="'Instrument Sans', 'Avenir Next', Arial, sans-serif" font-size="91" font-weight="650" letter-spacing="-3">splitter</text>
    <path d="M5 320H116" stroke="#895440" stroke-width="7" stroke-linecap="round"/>
    <text x="140" y="329" fill="#697961" font-family="'Instrument Sans', 'Avenir Next', Arial, sans-serif" font-size="24" font-weight="500" letter-spacing="5">SHARE FAIRLY</text>
  </g>
</svg>
